name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # jsdom 31 → undici 8 exige Node >= 22.19.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build and type-check
        run: npm run build

      - name: Type-check E2E specs
        run: npx tsc -p cypress/tsconfig.json --noEmit

  e2e:
    runs-on: ubuntu-latest
    # A suíte completa de navegador roda apenas em CI (ver docs/agents/testing.md).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          # Em CI a suíte roda contra o build de produção (preview): sem o
          # otimizador de deps do dev server e com o service worker ativo.
          build: npm run build
          start: npm run preview:test
          # 127.0.0.1 (e não localhost) evita resolução IPv6 no runner.
          wait-on: 'http://127.0.0.1:4173'
          wait-on-timeout: 180
          browser: chrome
          config: baseUrl=http://127.0.0.1:4173
          install-command: npm ci

      - name: Upload Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
          retention-days: 7
