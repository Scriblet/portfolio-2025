<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      URL canônica do site. Se o deploy mudar (domínio próprio, outro
      repositório no GitHub Pages, Netlify etc.), ajuste a base URL via
      VITE_BASE_URL no build e atualize as URLs absolutas abaixo
      (canonical, og:url, og:image, twitter:image e JSON-LD url/image).
    -->
    <title>Lucas Nonato · Consultor de IA & Software Engineer | Full Stack</title>
    <meta
      name="description"
      content="Portfólio de Lucas Nonato, Consultor de IA e Software Engineer. Experiência em React, TypeScript, Node.js, integração de LLMs e desenvolvimento web moderno."
    />
    <meta
      name="keywords"
      content="portfolio, consultor de ia, software engineer, full stack, react, typescript, node.js, llm, acessibilidade"
    />
    <meta name="author" content="Lucas Nonato" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://scriblet.github.io/portfolio-2025/" />
    <meta name="theme-color" content="#0a0814" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lucas Nonato" />
    <meta property="og:title" content="Lucas Nonato · Consultor de IA & Software Engineer | Full Stack" />
    <meta
      property="og:description"
      content="Portfólio de Lucas Nonato, Consultor de IA e Software Engineer. Experiência em React, TypeScript, Node.js, integração de LLMs e desenvolvimento web moderno."
    />
    <meta property="og:url" content="https://scriblet.github.io/portfolio-2025/" />
    <meta property="og:image" content="https://scriblet.github.io/portfolio-2025/og-preview.jpg" />
    <meta property="og:image:secure_url" content="https://scriblet.github.io/portfolio-2025/og-preview.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Lucas Nonato · Consultor de IA e Software Engineer"
    />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lucas Nonato · Consultor de IA & Software Engineer | Full Stack" />
    <meta
      name="twitter:description"
      content="Portfólio de Lucas Nonato, Consultor de IA e Software Engineer. Experiência em React, TypeScript, Node.js, integração de LLMs e desenvolvimento web moderno."
    />
    <meta name="twitter:image" content="https://scriblet.github.io/portfolio-2025/og-preview.jpg" />
    <meta
      name="twitter:image:alt"
      content="Lucas Nonato · Consultor de IA e Software Engineer"
    />

    <!-- Ícones -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Dados estruturados -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Lucas Nonato",
        "jobTitle": "Consultor de IA & Software Engineer",
        "description": "Portfólio de Lucas Nonato, Consultor de IA e Software Engineer. Experiência em React, TypeScript, Node.js, integração de LLMs e desenvolvimento web moderno.",
        "url": "https://scriblet.github.io/portfolio-2025/",
        "image": "https://scriblet.github.io/portfolio-2025/og-preview.jpg",
        "sameAs": [
          "https://github.com/Scriblet",
          "https://www.linkedin.com/in/lucas-nonato1/"
        ],
        "knowsAbout": [
          "React",
          "TypeScript",
          "Node.js",
          "Inteligência Artificial",
          "LLMs",
          "Acessibilidade",
          "UX Design"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
